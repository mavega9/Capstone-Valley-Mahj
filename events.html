<!DOCTYPE html>

  <meta name="description" content="View meetup schedules, venue details, and hosting guidelines for local Valley Mahj Co. gatherings.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@500;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

<body>
  <header class="site-header">
    <div class="header-inner">

          <li><a href="gear.html" class="nav-link">Gear & Sets</a></li>

          <li><a href="events.html" class="nav-link" aria-current="page">Hosting Blog</a></li>
        </ul>
      </nav>
      <a href="tips.html" class="btn-terracotta">Shop Digital Kits</a>

  <main>
    <p class="eyebrow">Community Gatherings</p>
    <h1 style="font-size: 2.5rem; margin-bottom: var(--space-md);">Meetup Schedule & RSVPs</h1>

    <div class="table-container">
      <table style="width: 100%; text-align: left; border-collapse: collapse; background: var(--color-white); border-radius: var(--radius-md); overflow: hidden;">
        <thead>
          <tr style="background: var(--color-surface-blush); border-bottom: 1px solid var(--color-ui-divider);">

        <tbody>
          <tr style="border-bottom: 1px solid var(--color-ui-divider);">
            <td style="padding: var(--space-sm);">Saturday, Oct 10</td>
            <td style="padding: var(--space-sm);">The Parlor Studio</td>
            <td style="padding: var(--space-sm);">2:00 PM - 5:00 PM</td>
            <td style="padding: var(--space-sm);"><a href="mailto:events@valleymahj.com" class="btn-terracotta">Reserve Spot</a></td>

        </tbody>
